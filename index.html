    <meta name="description" content="HR, attendance, piece-rate payroll and shift management for Sri Lankan socks knitting factories." />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("knithr-theme");
          if (!t) t = "dark";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.classList.toggle("light", t === "light");
        } catch (e) {}
      })();
    </script>
